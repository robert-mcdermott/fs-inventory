[workspace]
resolver = "3"
members = ["crates/fs-inventory-core", "crates/fs-inventory"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Robert McDermott"]
keywords = ["filesystem", "inventory", "parquet", "metadata", "hpc"]
categories = ["command-line-utilities", "filesystem"]

[workspace.dependencies]
fs-inventory-core = { path = "crates/fs-inventory-core", version = "0.3.0" }
arrow-array = "60"
arrow-schema = "60"
base64 = "0.23"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
crossbeam-channel = "0.5"
crossbeam-deque = "0.8"
crossbeam-utils = "0.8"
flate2 = "1.1"
globset = "0.4"
humantime = "2.3"
itoa = "1.0"
mimalloc = "0.1"
parquet = { version = "60", default-features = false, features = ["arrow", "snap", "lz4", "zstd", "flate2-rust_backend", "simdutf8"] }
proptest = "1.12"
rustix = { version = "1.1", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.4"
tempfile = "3.27"
unicode-normalization = "0.1"
zstd = "0.14"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
