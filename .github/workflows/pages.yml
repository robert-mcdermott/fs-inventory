name: Docs site

# Publishing a release builds the documentation site from that release's Markdown and deploys it
# to GitHub Pages, so the site describes the version install.sh installs. Run it by hand to
# rebuild, for example after a fix to the docs or the site's templates: it publishes the latest
# release's docs, or those of the tag or branch you give.
#   gh workflow run pages.yml
#   gh workflow run pages.yml -f ref=v0.4.0

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or branch whose docs to publish (default: the latest release)'
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - name: Choose the docs to publish
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ github.event.release.tag_name }}
          INPUT: ${{ inputs.ref }}
        run: |
          ref="${RELEASE:-$INPUT}"
          if [ -z "$ref" ]; then
            ref="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      # The site builder comes from this workflow's commit, and the Markdown from the chosen
      # ref, so older releases' docs can be published with the current builder.
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.ref }}
          path: content
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv run --no-project --with markdown-it-py==4.2.0 site/build.py --source content --ref "${{ steps.ref.outputs.ref }}" --out _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
