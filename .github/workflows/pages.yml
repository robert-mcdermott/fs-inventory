name: Docs site

# Builds the documentation site and commits it to the gh-pages branch, which GitHub Pages serves
# (Settings → Pages → Deploy from a branch → gh-pages, / (root)). It runs when a release is
# published, so the site describes the version install.sh installs. Run it by hand to republish,
# such as after fixing a typo in the docs:
#   gh workflow run pages.yml              the latest release's docs
#   gh workflow run pages.yml -f ref=main  the docs on main

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or branch whose docs to publish (default: the latest release)'
        required: false

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish the site
    runs-on: ubuntu-latest
    steps:
      - name: Choose the docs to publish
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ github.event.release.tag_name }}
          INPUT: ${{ inputs.ref }}
        run: |
          ref="${RELEASE:-$INPUT}"
          if [ -z "$ref" ]; then
            ref="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      # The site builder comes from this workflow's commit, and the Markdown from the chosen
      # ref, so older releases' docs can be published with the current builder.
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.ref }}
          path: content
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv run --no-project --with markdown-it-py==4.2.0 site/build.py --source content --ref "${{ steps.ref.outputs.ref }}" --out _site
      - name: Commit the site to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          # The branch holds only the latest site, as a single commit.
          cd _site
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Docs site for $REF"
          git push --force "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" gh-pages
